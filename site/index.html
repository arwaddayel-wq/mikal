<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكيال · روابطنا</title>
<meta name="description" content="مكيال: زكاتك.. بالمكيال. جربي التطبيق، العبي، وتواصلي مع الفريق.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Almarai:wght@400;700;800&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1C1511;--card:#261D17;--line:#3E3026;--gold:#C9A27A;--gold2:#E9CF9F;--cream:#F5E9DD;--muted:#A68B6B;--bronze:#A67C52}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--cream);font-family:'Almarai',sans-serif;-webkit-font-smoothing:antialiased}
.pattern{position:fixed;inset:0 0 auto 0;height:340px;pointer-events:none;opacity:.9;
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.wrap{position:relative;max-width:440px;margin:0 auto;padding:56px 20px 48px;display:flex;flex-direction:column;align-items:center}
.logo{font-family:'Amiri',serif;font-weight:700;font-size:64px;line-height:1.3;color:var(--gold2)}
.en{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:13px;letter-spacing:8px;color:var(--bronze);direction:ltr;margin-top:-4px}
.tag{margin-top:10px;font-size:15px;color:var(--gold)}
.btns{width:100%;margin-top:34px;display:flex;flex-direction:column;gap:12px}
a.btn,button.btn{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:14px 18px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);color:var(--cream);text-decoration:none;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-align:right;transition:transform .15s,border-color .15s,background .15s}
a.btn:hover,button.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
a.btn:active,button.btn:active{transform:scale(.98)}
.btn .ic{flex-shrink:0;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#33271F;color:var(--gold)}
.btn .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.btn small{font-size:12px;font-weight:400;color:var(--muted)}
.btn .arr{color:var(--muted);flex-shrink:0}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1C1511;min-height:74px;font-size:18px}
.btn.primary .ic{background:#1C1511;color:var(--gold2)}
.btn.primary small{color:#4A3726}
.btn.primary .arr{color:#1C1511}
.sec{width:100%;margin-top:38px}
.sec h2{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--gold);margin-bottom:14px}
.sec h2:before,.sec h2:after{content:"";flex:1;height:1px;background:var(--line)}
.team{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team a{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--cream);text-decoration:none;font-size:14px;font-weight:700;transition:border-color .15s}
.team a:hover{border-color:var(--gold)}
.team a:last-child:nth-child(odd){grid-column:1/-1;justify-content:center}
.in{flex-shrink:0;width:28px;height:28px;border-radius:7px;background:#33271F;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-weight:800;font-size:13px}
/* flow overlay */
#flow{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#flow.open{display:block;animation:up .28s ease}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
body.lock{overflow:hidden}
.fbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:rgba(28,21,17,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ft{font-family:'Amiri',serif;font-weight:700;font-size:26px;color:var(--gold2);line-height:1.2}
.fs{font-size:12px;color:var(--muted)}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--cream);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fbody{max-width:440px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;align-items:center}
.scr{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.ph{width:250px;padding:7px;border-radius:38px;background:#0E0A08;border:1.5px solid #4A3A2D;box-shadow:0 24px 40px -18px rgba(0,0,0,.8)}
.ph img{display:block;width:100%;border-radius:31px}
.scr figcaption{text-align:center;font-size:14px;line-height:1.7;color:var(--muted);max-width:280px}
.scr figcaption b{display:block;font-size:19px;color:var(--cream);margin-bottom:2px}
.scr figcaption span,.q span,.payend span{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1C1511;font-weight:800;font-size:13px;margin-bottom:6px}
.down{width:2px;height:40px;margin:16px 0;background:linear-gradient(var(--line),var(--gold));position:relative}
.down:after{content:"";position:absolute;bottom:-2px;left:-4px;width:8px;height:8px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
.q{display:flex;flex-direction:column;align-items:center;font-family:'Amiri',serif;font-weight:700;font-size:30px;color:var(--gold2);margin-bottom:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.scr.sm .ph{width:100%;padding:5px;border-radius:26px}
.scr.sm .ph img{border-radius:21px}
.scr.sm.hold .ph{border-color:var(--gold)}
.scr.sm figcaption{font-size:12px}
.scr.sm figcaption b{font-size:15px}
.scr.sm em{display:block;font-style:normal;font-size:22px;font-weight:800;color:var(--gold2)}
.payend{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px;border-radius:20px;background:var(--gold);color:#4A3726;font-size:14px}
.payend b{font-size:20px;color:#1C1511}
.payend span{background:#1C1511;color:var(--gold2)}
.foot{margin-top:42px;font-size:12px;color:#7A6550;text-align:center;line-height:1.8}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
</style>
</head>
<body>
<svg class="pattern" aria-hidden="true" width="100%" height="340"><defs><pattern id="st" width="54" height="54" patternUnits="userSpaceOnUse"><g fill="none" stroke="#A67C52" stroke-width="1" opacity=".28"><rect x="15" y="15" width="24" height="24"/><rect x="15" y="15" width="24" height="24" transform="rotate(45 27 27)"/><circle cx="27" cy="27" r="5"/><path d="M0 27H8M46 27H54M27 0V8M27 46V54"/></g></pattern></defs><rect width="100%" height="340" fill="url(#st)"/></svg>

<main class="wrap">
  <div class="logo">مكــــيال</div>
  <div class="en">MIKYAL</div>
  <div class="tag">زكاتك.. بالمكيال</div>

  <div class="btns">
    <a class="btn primary" id="appLink" href="https://mikyal.netlify.app/app.html" target="_blank" rel="noopener">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg></span>
      <span class="tx">جرّبي التطبيق<small>احسبي زكاتك بأقل من دقيقة</small></span>
      <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <a class="btn" id="gameLink" href="https://mikyal-game.netlify.app/" target="_blank" rel="noopener">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 14h.01"/></svg></span>
      <span class="tx">العبي معنا<small>لعبة مكيال</small></span>
      <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <button class="btn" id="flowBtn" type="button" aria-expanded="false" aria-controls="flow">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M6 7.5v4a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v-1"/></svg></span>
      <span class="tx">اليوزر فلو<small>رحلة المستخدم من أول شاشة للدفع</small></span>
      <svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>


  <section class="sec" aria-label="فريق مكيال">
    <h2>فريق مكيال</h2>
    <div class="team" id="team"></div>
  </section>

  <div class="foot">FTEC341 · FinTech &amp; Financial Transformation<br>جامعة الأميرة نورة بنت عبدالرحمن</div>
</main>
  <div id="flow" role="dialog" aria-modal="true" aria-label="اليوزر فلو">
    <div class="fbar">
      <div><div class="ft">اليوزر فلو</div><div class="fs">رحلة المستخدم في مكيال</div></div>
      <button type="button" class="x" id="flowClose" aria-label="إغلاق"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="fbody">
      <figure class="scr"><div class="ph"><img src="screens/01-home.png" alt="شاشة الرئيسية"></div><figcaption><span>١</span><b>الرئيسية</b>مجموع أصولك وزكاتك، وكم باقي على الحول</figcaption></figure>
      <div class="down"></div>
      <figure class="scr"><div class="ph"><img src="screens/03-assets.png" alt="شاشة الأصول"></div><figcaption><span>٢</span><b>الأصول</b>تضيفين ذهب، أسهم، استثمار، أو عملات رقمية</figcaption></figure>
      <div class="down"></div>
      <div class="q"><span>٣</span>ليش شاريه؟</div>
      <div class="pair">
        <figure class="scr sm hold"><div class="ph"><img src="screens/04-add-asset-hold.png" alt="إضافة أصل: أحتفظ فيه"></div><figcaption><b>أحتفظ فيه</b><em>٢٧٠ ر.س</em>٢٫٥٪ × ٢٥٪</figcaption></figure>
        <figure class="scr sm"><div class="ph"><img src="screens/05-add-asset-trade.png" alt="إضافة أصل: أبيع وأشتري"></div><figcaption><b>أبيع وأشتري</b><em>١٬٠٧٨ ر.س</em>٢٫٥٪ × ١٠٠٪</figcaption></figure>
      </div>
      <div class="down"></div>
      <figure class="scr"><div class="ph"><img src="screens/02-currencies.png" alt="شاشة العملات"></div><figcaption><span>٤</span><b>العملات</b>كل عملة تتحول للريال وتنجمع بمكان واحد</figcaption></figure>
      <div class="down"></div>
      <figure class="scr"><div class="ph"><img src="screens/06-hawl.png" alt="شاشة الحول"></div><figcaption><span>٥</span><b>الحول</b>عداد بالأيام وتذكير قبل أسبوع</figcaption></figure>
      <div class="down"></div>
      <div class="payend"><span>٦</span><b>الدفع عبر إحسان</b>أو جمعية مرخصة تختارينها</div>
    </div>
  </div>


<script>
// ===== عدلي الروابط هنا =====
const CONFIG = {
  app:  "https://mikyal.netlify.app/app.html",
  game: "https://mikyal-game.netlify.app/",
  team: [
    { name: "أروى دايل",     url: "https://www.linkedin.com/in/arwa-dayel-alshahrani-%D8%A7%D8%B1%D9%88%D9%89-%D8%AF%D8%A7%D9%8A%D9%84-3b3423333" },
    { name: "ليان التميمي",   url: "https://www.linkedin.com/in/layanaltamimipnu" },
    { name: "غلا الوهيبي",    url: "https://www.linkedin.com/in/ghala-alwehaibi-a7030a411" },
    { name: "رند آل عادي",    url: "https://www.linkedin.com/in/rand-alaadi-9411ab327" },
    { name: "جمانة الجميعة",  url: "https://www.linkedin.com/in/jumanah-aljumayah-8ab440327" }
  ]
};
// ============================
document.getElementById('appLink').href = CONFIG.app;
document.getElementById('gameLink').href = CONFIG.game;
const team = document.getElementById('team');
CONFIG.team.forEach(p => {
  const a = document.createElement('a');
  a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
  a.setAttribute('aria-label', p.name + ' على لينكدإن');
  a.innerHTML = '<span class="in">in</span><span></span>';
  a.lastChild.textContent = p.name;
  team.appendChild(a);
});
const fb = document.getElementById('flowBtn'), fl = document.getElementById('flow');
function setFlow(open){ fl.classList.toggle('open', open); document.body.classList.toggle('lock', open); fb.setAttribute('aria-expanded', open); if(open){ fl.scrollTop = 0; document.getElementById('flowClose').focus(); } else fb.focus(); }
fb.addEventListener('click', () => setFlow(true));
document.getElementById('flowClose').addEventListener('click', () => setFlow(false));
fl.addEventListener('keydown', e => { if (e.key === 'Escape') setFlow(false); });
</script>
</body>
</html>
